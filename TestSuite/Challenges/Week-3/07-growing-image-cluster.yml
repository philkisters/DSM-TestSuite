name: growing-image-cluster
protocols:
  peer: v3
  orchestrator: v1
description: Starts a small cluster and saves some images. Peers leave gracefully, and new peers join, lets see what happens. 
archived: false
check_fingers: true
check_images: true

steps:
  - action: setup-network
    peer-names: [home-assistant, tor-relay, discord-bot, meme-database, anime-downloader, minecraft-server, pirateflix, family-tracker, backup-cloud, bitcoin-miner]
    timeout: 1
  - assert: message-sent
    from: tor-relay
    to: home-assistant
    code: 1
    timeout: 10
  - action: put-images
    peer-name: home-assistant
    images:
      - image-1.png
      - image-2.png
      - image-3.png
      - image-4.png
      - image-5.png
      - image-6.png
      - image-7.png
      - image-8.png
      - image-9.png
      - image-10.png
      - image-11.png
      - image-12.png
      - image-13.png
      - image-14.png
      - image-15.png
      - image-16.png
      - image-17.png
      - image-18.png
      - image-19.png
      - image-20.png 
  - action: put-images
    peer-name: meme-database
    images:
      - image-101.png
      - image-102.png
      - image-103.png
      - image-104.png
      - image-105.png
      - image-106.png
      - image-107.png
      - image-108.png
      - image-109.png
      - image-110.png
      - image-111.png
      - image-112.png
      - image-113.png
      - image-114.png
      - image-115.png
      - image-116.png
      - image-117.png
      - image-118.png
      - image-119.png
      - image-120.png
  - assert: valid-network
    timeout: 120
  - action: join-peers
    peer-names: [late-peer-1, late-peer-2, late-peer-3, late-peer-4, late-peer-5, late-peer-6]
    timeout: 1
  - assert: valid-network
    timeout: 120
  - action: leave-peer
    peer-name: home-assistant
  - action: leave-peer
    peer-name: tor-relay
  - action: leave-peer
    peer-name: discord-bot
  - action: leave-peer
    peer-name: meme-database
  - assert: valid-network
    timeout: 120
  - action: put-images
    peer-name: late-peer-1
    images:
      - image-201.png
      - image-202.png
      - image-203.png
      - image-204.png
      - image-205.png
      - image-206.png
      - image-207.png
      - image-208.png
      - image-209.png
      - image-210.png
      - image-211.png
      - image-212.png
      - image-213.png
      - image-214.png
      - image-215.png
      - image-216.png
      - image-217.png
      - image-218.png
      - image-219.png
      - image-220.png
  - assert: valid-network
    timeout: 120
  - action: destroy-network
  - assert: peers-registered
    number: 0