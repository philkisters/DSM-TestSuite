name: put-images
protocols:
  peer: v3
  orchestrator: v1
description: Let's see if we can add the images to a peer in the network.
archived: false
check_fingers: true

steps:
  - action: start-peer
    peer-name: first-peer
  - assert: peer-registered
    peer-name: first-peer
  - action: join-peer
    peer-name: first-peer
  - assert: joined
    peer-name: first-peer
  - action: put-images
    peer-name: first-peer
    images: 
      - image-42.png
      - image-23.png
  - assert: image-list
    peer-name: first-peer
    images:
      - image-42.png
      - image-23.png
  - action: stop-peer
    peer-name: first-peer
  - assert: peers-registered
    number: 0