[project]
name = "dsm-db"
version = "0.1.0"
description = "SQLAlchemy models of the shared DSM PostgreSQL database (schema history lives in ../migrations)"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
